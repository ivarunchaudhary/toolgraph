# ToolGraph local stack: HydraDB graph-node + graph-indexer (local object-store provider) + app.
# Hosted deploy (Railway) uses an S3-compatible bucket instead; see infra/README.md.
# HydraDB (AGPL-3.0) is used unmodified as an external service via its published image.
x-hydradb-env: &hydradb-env
  CLOUD_PROVIDER: local
  LOCAL_PATH: /var/lib/hydradb/store
  GRAPH_NAMESPACE: default
  GRAPH_ID: default
  GRAPH_DATABASE: default
  GRAPH_CELL_ID: cell-0
  GRAPH_CELLS: cell-0
  GRAPH_DATA_PATH: slatedb-graph/data
  GRAPH_DATA_CACHE_DIR: /var/cache/slatedb/data
  GRAPH_DATA_CACHE_MAX_OPEN_FILES: "512"
  GRAPH_AUTH_TOKEN_FILE: /run/hydradb/auth-token
  GRAPH_ALLOW_PLAINTEXT: "true"
  GRAPH_BOLT_ADDR: 0.0.0.0:7687
  GRAPH_HTTP_ADDR: 0.0.0.0:8443
  GRAPH_ADMIN_ADDR: 0.0.0.0:9090
  GRAPH_NODE_ID: node-0
  GRAPH_ADVERTISED_BOLT_ADDR: hydradb:7687
  GRAPH_BOLT_NODE_ADDRESSES: node-0=hydradb:7687
  GRAPH_INDEXER_ADMIN_ADDR: 0.0.0.0:9091
  GRAPH_INDEXER_NOTIFY_URL: http://hydradb-indexer:9091/v1/changes:process
  GRAPH_INDEXER_INTERVAL_MS: "2000"
  GRAPH_INDEXER_DIRTY_POLL_INTERVAL_MS: "250"
  GRAPH_INDEXER_BUILD_MODE: full
  GRAPH_WAL_FLUSH_INTERVAL_MS: "50"
  RUST_MIN_STACK: "33554432"
  RUST_LOG: info

services:
  store-init:
    image: busybox:1.36
    command: sh -c 'mkdir -p /var/lib/hydradb/store && chown -R 10001:10001 /var/lib/hydradb /var/cache/slatedb /var/cache/idx'
    volumes: [hydradb-store:/var/lib/hydradb, hydradb-cache:/var/cache/slatedb, indexer-cache:/var/cache/idx]

  token-init:
    image: busybox:1.36
    command: sh -c 'printf "%s" "$$TOKEN" > /run/hydradb/auth-token && chmod 444 /run/hydradb/auth-token'
    environment:
      TOKEN: ${HYDRADB_AUTH_TOKEN:-local-development-token-32-bytes}
    volumes: [hydradb-secret:/run/hydradb]

  hydradb:
    image: ghcr.io/hydra-db/hydradb:0.3.0
    depends_on:
      store-init: {condition: service_completed_successfully}
      token-init: {condition: service_completed_successfully}
    environment: *hydradb-env
    volumes:
      - hydradb-secret:/run/hydradb:ro
      - hydradb-store:/var/lib/hydradb
      - hydradb-cache:/var/cache/slatedb
    ports:
      - "127.0.0.1:7687:7687"
      - "127.0.0.1:8443:8443"
      - "127.0.0.1:9090:9090"

  hydradb-indexer:
    image: ghcr.io/hydra-db/hydradb:0.3.0
    entrypoint: ["/usr/local/bin/graph-indexer"]
    depends_on:
      store-init: {condition: service_completed_successfully}
      token-init: {condition: service_completed_successfully}
    environment: *hydradb-env
    volumes:
      - hydradb-secret:/run/hydradb:ro
      - hydradb-store:/var/lib/hydradb
      - indexer-cache:/var/cache/slatedb
    ports: ["127.0.0.1:9091:9091"]

  app:
    build: .
    profiles: [app]
    depends_on: [hydradb]
    env_file: .env
    environment:
      HYDRADB_URL: http://hydradb:8443
      HYDRADB_BOLT_URL: bolt://hydradb:7687
      HYDRADB_MAX_INFLIGHT: ${HYDRADB_MAX_INFLIGHT:-4}
    ports: ["8000:8000"]

volumes:
  hydradb-store:
  hydradb-secret:
  hydradb-cache:
  indexer-cache:
